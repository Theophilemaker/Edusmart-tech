<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - EduSmart Pro</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .offline-container {
      text-align: center;
      padding: 50px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .offline-icon {
      font-size: 5em;
      color: #4361ee;
      margin-bottom: 20px;
    }
    h1 { margin-bottom: 20px; }
    p { color: #666; margin-bottom: 30px; }
    .btn-retry {
      background: linear-gradient(135deg, #4361ee 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>Don't worry! You can still access your profile, view cached courses, and check your badges. Some features may be limited until you're back online.</p>
    <button class="btn-retry" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
